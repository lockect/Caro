<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cờ Caro (Gomoku) Pro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Be Vietnam Pro & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      touch-action: manipulation;
      padding-top: max(0.25rem, env(safe-area-inset-top));
      padding-bottom: max(0.25rem, env(safe-area-inset-bottom));
      padding-left: max(0.25rem, env(safe-area-inset-left));
      padding-right: max(0.25rem, env(safe-area-inset-right));
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    .modal-safe-area {
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }
    /* Khóa cuộn màn hình khi thao tác trực tiếp trên canvas */
    #boardCanvas {
      touch-action: none;
    }
    /* Hiệu ứng chuyển động mượt */
    .smooth-transition {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Vân gỗ và đổ bóng sâu cho container bàn cờ */
    .wood-bezel {
      background: linear-gradient(145deg, #78350f, #451a03);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6),
                  inset 0 2px 4px rgba(255, 255, 255, 0.2),
                  inset 0 -3px 6px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 overflow-x-hidden">
  
  <!-- Header / Top Bar -->
  <header class="w-full max-w-lg flex items-center justify-between py-1.5 px-3 bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-800 shadow-lg mb-2">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center shadow-md shadow-amber-500/20">
        <span class="font-outfit font-extrabold text-slate-950 text-base">XO</span>
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-bold tracking-tight bg-gradient-to-r from-amber-200 to-amber-400 bg-clip-text text-transparent">CỜ CARO PRO</h1>
        <p class="text-[10px] text-slate-400 leading-none">Gomoku Master 19×19</p>
      </div>
    </div>

    <!-- Nút tùy chọn cài đặt & âm thanh -->
    <div class="flex items-center space-x-1.5">
      <button id="btnSoundToggle" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 active:scale-95 smooth-transition" title="Bật/Tắt âm thanh">
        <svg id="iconSoundOn" class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
          <path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z"/>
        </svg>
        <svg id="iconSoundOff" class="w-4 h-4 text-slate-500 hidden" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM12.293 7.293a1 1 0 011.414 0L15 8.586l1.293-1.293a1 1 0 111.414 1.414L16.414 10l1.293 1.293a1 1 0 01-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 01-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </button>

      <button id="btnSettingsToggle" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 active:scale-95 smooth-transition" title="Cài đặt">
        <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="w-full max-w-lg grid grid-cols-2 gap-2 mb-2">
    <!-- Người chơi 1 (X) Card -->
    <div id="playerXCard" class="relative overflow-hidden bg-slate-900/90 rounded-2xl p-2.5 border-2 border-cyan-500/60 shadow-md smooth-transition">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-cyan-950/80 border border-cyan-500/80 flex items-center justify-center font-outfit font-black text-cyan-400 text-sm shadow-inner">
            X
          </div>
          <div>
            <div id="labelPlayerX" class="text-xs font-bold text-slate-200">Bạn (Người)</div>
            <div class="text-[10px] text-cyan-400/80 font-medium">Đi trước</div>
          </div>
        </div>
        <div id="scoreX" class="font-outfit text-xl font-black text-cyan-400">0</div>
      </div>
      <!-- Turn Indicator Bar -->
      <div id="turnIndicatorX" class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-500 to-blue-500 shadow-[0_0_8px_rgba(6,182,212,0.8)]"></div>
    </div>

    <!-- Người chơi 2 hoặc AI (O) Card -->
    <div id="playerOCard" class="relative overflow-hidden bg-slate-900/70 rounded-2xl p-2.5 border-2 border-transparent shadow-md smooth-transition opacity-80">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-rose-950/80 border border-rose-500/80 flex items-center justify-center font-outfit font-black text-rose-400 text-sm shadow-inner">
            O
          </div>
          <div>
            <div id="labelPlayerO" class="text-xs font-bold text-slate-300">Máy (AI Vừa)</div>
            <div id="statusSubO" class="text-[10px] text-slate-400 font-medium">Chờ lượt</div>
          </div>
        </div>
        <div id="scoreO" class="font-outfit text-xl font-black text-rose-400">0</div>
      </div>
      <div id="turnIndicatorO" class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-rose-500 to-amber-500 hidden shadow-[0_0_8px_rgba(244,63,94,0.8)]"></div>
    </div>
  </section>

  <main class="w-full flex-1 flex flex-col items-center justify-center">
    <!-- Banner Thông Tin Chế Độ (Cờ Chớp / Vượt Tháp / Giải Đố) -->
    <div id="modeBannerBadge" class="hidden w-full max-w-lg mb-1.5 py-1 px-3 bg-slate-900/90 border border-amber-500/40 rounded-xl text-center shadow flex items-center justify-between">
      <span id="modeBannerText" class="text-xs font-bold text-amber-300">⏱️ Cờ Chớp: 10s</span>
      <button id="btnHintPuzzle" class="hidden py-0.5 px-2 rounded-lg bg-amber-500/20 border border-amber-400/50 text-[10px] font-bold text-amber-300 hover:bg-amber-500/30 active:scale-95">
        💡 Gợi Ý
      </button>
    </div>

    <div id="boardContainer" class="relative p-2.5 sm:p-3 wood-bezel rounded-2xl sm:rounded-3xl border border-amber-900/60 transition-transform">
      <canvas id="boardCanvas" class="rounded-xl shadow-inner cursor-pointer block"></canvas>
      
      <!-- AI Thinking Overlay Spinner -->
      <div id="aiThinkingBadge" class="absolute top-5 right-5 hidden bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-full border border-amber-500/40 shadow-lg items-center space-x-2">
        <div class="w-3 h-3 border-2 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-[11px] font-semibold text-amber-300">AI đang tính...</span>
      </div>
    </div>
  </main>

  <footer class="w-full max-w-lg mt-2 pt-1 flex items-center justify-between gap-2">
    <!-- Nút Đi Lại (Undo) -->
    <button id="btnUndo" class="flex-1 py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 active:scale-95 text-slate-200 font-semibold text-xs sm:text-sm flex items-center justify-center space-x-1.5 shadow-md smooth-transition disabled:opacity-40 disabled:pointer-events-none">
      <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
      </svg>
      <span>Đi Lại</span>
    </button>

    <!-- Nút Ván Mới (Reset) -->
    <button id="btnNewGame" class="flex-1 py-2.5 px-3 rounded-xl bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold text-xs sm:text-sm flex items-center justify-center space-x-1.5 shadow-lg shadow-amber-600/30 active:scale-95 smooth-transition">
      <svg class="w-4 h-4 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      <span>Ván Mới</span>
    </button>

    <!-- Nút Lịch Sử & Thống Kê Nước Đi -->
    <div class="px-3 py-2 bg-slate-900/90 rounded-xl border border-slate-800 text-center min-w-[70px]">
      <span class="block text-[9px] uppercase tracking-wider text-slate-400 font-bold">Nước đi</span>
      <span id="moveCountText" class="font-outfit font-black text-amber-400 text-sm">0</span>
    </div>
  </footer>

  <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 modal-safe-area hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full shadow-2xl relative">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
        <h3 class="font-bold text-base text-slate-100 flex items-center space-x-2">
          <span>⚙️</span>
          <span>Cấu hình ván đấu</span>
        </h3>
        <button id="btnCloseSettings" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Chế độ chơi: Solo vs AI, 2 Người, Cờ Chớp, Vượt Tháp, Giải Đố -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Chế độ chơi</label>
          <div class="grid grid-cols-2 gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs font-bold">
            <button id="btnModePvE" class="btn-mode py-1.5 rounded-lg bg-amber-500 text-slate-950 shadow">
              🤖 Đấu AI
            </button>
            <button id="btnModePvP" class="btn-mode py-1.5 rounded-lg text-slate-400 hover:text-white">
              👥 2 Người
            </button>
            <button id="btnModeBlitz" class="btn-mode py-1.5 rounded-lg text-slate-400 hover:text-white">
              ⏱️ Cờ Chớp
            </button>
            <button id="btnModeTower" class="btn-mode py-1.5 rounded-lg text-slate-400 hover:text-white">
              🏰 Vượt Tháp
            </button>
            <button id="btnModePuzzle" class="btn-mode col-span-2 py-1.5 rounded-lg text-slate-400 hover:text-white border border-amber-500/30 bg-amber-500/10">
              🧩 Giải Đố Thế Cờ (VCF)
            </button>
          </div>
        </div>

        <!-- Cấp độ AI (Ẩn khi chọn 2 người) -->
        <div id="aiLevelSection">
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Cấp độ Máy</label>
          <div class="grid grid-cols-4 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-center">
            <button data-diff="easy" class="btn-diff py-1.5 text-[10px] font-medium rounded-lg text-slate-400">Dễ</button>
            <button data-diff="medium" class="btn-diff py-1.5 text-[10px] font-bold rounded-lg bg-amber-500 text-slate-950">Vừa</button>
            <button data-diff="hard" class="btn-diff py-1.5 text-[10px] font-medium rounded-lg text-slate-400">Khó 🔥</button>
            <button data-diff="hell" class="btn-diff py-1.5 text-[10px] font-medium rounded-lg text-rose-400 hover:text-rose-300">Địa Ngục 💀</button>
          </div>
        </div>

        <!-- Chọn quân cờ của người chơi -->
        <div id="playerSideSection">
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Quân của bạn (Máy)</label>
          <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
            <button id="btnPickX" class="py-2 text-xs font-bold rounded-lg bg-cyan-600 text-white flex items-center justify-center space-x-1.5">
              <span>Quân X (Đi trước)</span>
            </button>
            <button id="btnPickO" class="py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white flex items-center justify-center space-x-1.5">
              <span>Quân O (Đi sau)</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Áp dụng và đóng -->
      <button id="btnApplySettings" class="w-full mt-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 font-bold text-slate-950 text-sm shadow-md active:scale-95 smooth-transition">
        Lưu & Bắt Đầu Ván Mới
      </button>
    </div>
  </div>

  <div id="winModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 modal-safe-area hidden">
    <canvas id="confettiCanvas" class="absolute inset-0 pointer-events-none w-full h-full"></canvas>
    <div class="bg-slate-900/95 border border-amber-500/50 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl relative z-10 animate-bounce-short">
      <div id="winBadgeIcon" class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-3xl shadow-lg">
        🏆
      </div>
      <h2 id="winTitle" class="font-outfit text-2xl font-black text-amber-300 tracking-wide mb-1">CHIẾN THẮNG!</h2>
      <p id="winDescription" class="text-xs text-slate-300 mb-5 leading-relaxed">Người chơi X đã hoàn thành chuỗi 5 quân cờ liên tiếp.</p>
      
      <div class="space-y-2">
        <button id="btnModalNewGame" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 font-extrabold text-slate-950 text-sm shadow-lg shadow-amber-500/20 active:scale-95 smooth-transition">
          Chơi Ván Tiếp Theo
        </button>
        <button id="btnModalCloseReview" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs active:scale-95 smooth-transition">
          Xem Lại Bàn Cờ
        </button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>

  <script>
    /* Inline Fallback Initialization for direct local browser opening */
    if (typeof resetGame === 'function') {
      window.addEventListener('DOMContentLoaded', () => {
        resizeCanvas();
        resetGame();
      });
    }
  </script>
</body>
</html>
